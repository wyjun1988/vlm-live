# Live3R 0.8B — 엣지 판본. Qwen3.5-0.8B (hidden 1024, 24층, linear18/full6)
#
# ⚠️ 이 스케일에서는 기하 인코더(CUT3R 793M)가 LLM 보다 무겁다.
#    정확도가 아니라 "30fps 인제스트 + TTFT<300ms" 가 이 판본의 존재 이유다.
#    비용 축소 축 3개: stride(인코더를 매 프레임 안 돌림) / merge_size(토큰 축소) / 인코더 증류
base_model: Qwen/Qwen3.5-0.8B
dtype: bf16
attn_implementation: sdpa

geometry:
  name: cut3r              # dummy | cut3r | anchor3r | lingbot | vggt_window
  checkpoint: checkpoints/cut3r_512_dpt_4_64.pth
  tap_layers: [11, 17, 23] # SpatialStack 기본값
  hidden_size: 768         # CUT3R 디코더 잠재 차원 — 실제 체크포인트로 확인 필요
  image_size: 512
  stride: 2
  freeze: true
  expose_pose_token: true

fusion:
  mode: deepstack
  inject_layers: [0, 1, 2]
  merge_size: 4
  mlp_ratio: 2.0
  zero_init: true

lora:
  enabled: true
  r: 8
  alpha: 16
  dropout: 0.05

stream:
  max_visual_tokens: 8192
  budget_policy: evict
  target_fps: 30.0
