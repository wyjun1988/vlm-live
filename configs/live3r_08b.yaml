# Live3R 0.8B — 엣지 판본. Qwen3.5-0.8B (hidden 1024, 24층, linear18/full6)
#
# ⚠️ 이 스케일에서는 기하 인코더(CUT3R 793M)가 LLM 보다 무겁다.
#    정확도가 아니라 "30fps 인제스트 + TTFT<300ms" 가 이 판본의 존재 이유다.
#    비용 축소 축 3개: stride(인코더를 매 프레임 안 돌림) / merge_size(토큰 축소) / 인코더 증류
base_model: Qwen/Qwen3.5-0.8B
dtype: bf16
attn_implementation: sdpa

geometry:
  name: cut3r              # dummy | cut3r | anchor3r | lingbot | vggt_window
  checkpoint: checkpoints/cut3r_512_dpt_4_64.pth
  # CUT3R 디코더는 12층이고, CUT3R 자신의 헤드가 dec[0],dec[6],dec[9],dec[12] 를 쓴다.
  # SpatialStack 의 [11,17,23] 은 VGGT 24층 기준이라 그대로 쓰면 범위를 벗어난다.
  tap_layers: [6, 9, 12]
  hidden_size: 768         # = dec_embed_dim (저장소 코드 확인)
  image_size: 512
  stride: 2
  freeze: true
  expose_pose_token: true
  options:
    # CUT3R 클론 경로. PYTHONPATH 로 줘도 된다.
    repo_path: null
    # ⚠️ GPU 머신에서 반드시: cd <CUT3R>/src/croco/models/curope && python setup.py build_ext --inplace
    #    CUT3R 포즈 토큰 위치가 -1 인데 순수 PyTorch RoPE2D 폴백은 음수에서 터진다.
    #    (live3r 이 폴백을 고쳐서 돌긴 하지만, 컴파일판이 훨씬 빠르다)

fusion:
  mode: deepstack
  inject_layers: [0, 1, 2]
  merge_size: 4
  mlp_ratio: 2.0
  zero_init: true

lora:
  enabled: true
  r: 8
  alpha: 16
  dropout: 0.05

stream:
  max_visual_tokens: 8192
  budget_policy: evict
  target_fps: 30.0
