# M2 zero-shot, base 0.8B (no training) + 실제 CUT3R 로 지도 프롬프트만 붙인다 (2026-09-24).
#   The projector is zero-init (no weights) -> injection is exactly 0 = same output as the base VLM.
#   CUT3R runs only to produce points/poses for the measured facts (I-27/I-29).
#   scripts/eval_vsi_local.py --config configs/m2_zeroshot_08b.yaml --scene-map --modes oracle-video
#   Tests whether explicit measurements let a smaller LLM carry the spatial reasoning (I-22).
# Checkpoint paths are local to this machine (checkpoints/ is gitignored).
base_model: checkpoints/qwen3.5-0.8b
dtype: bf16

geometry:
  name: cut3r
  checkpoint: checkpoints/cut3r_512_dpt_4_64.pth
  tap_layers: [6, 9, 12]
  hidden_size: 768
  image_size: 512
  options:
    repo_path: .refs/CUT3R

fusion:
  mode: deepstack
  inject_layers: [0, 1, 2]
  merge_size: 2
  zero_init: true

lora:
  enabled: false

data:
  max_pixels: 131072     # 128×32×32 → 이미지당 LLM 토큰 ≤128
  max_images: 32
  max_length: 8192
