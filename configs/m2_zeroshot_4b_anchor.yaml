# M2 zero-shot, CUT3R with the camera-height scale anchor (I-37, 2026-09-28).
#   Same as m2_zeroshot_4b.yaml; the encoder's output is rescaled per frame so the camera keeps the height above the
#   floor it had in the first frames. Undoes the state's scale drift (room area 1.03x -> 1.23x -> 1.39x with more
#   frames ingested) without touching angles - unlike state resets, which cost the direction facts.
base_model: checkpoints/qwen3.5-4b
dtype: bf16

geometry:
  name: cut3r
  checkpoint: checkpoints/cut3r_512_dpt_4_64.pth
  tap_layers: [6, 9, 12]
  hidden_size: 768
  image_size: 512
  options:
    repo_path: .refs/CUT3R
    scale_anchor: camera_height

fusion:
  mode: deepstack
  inject_layers: [0, 1, 2]
  merge_size: 2
  zero_init: true

lora:
  enabled: false

data:
  max_pixels: 131072
  max_images: 32
  max_length: 8192
