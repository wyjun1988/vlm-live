# Run 2 (docs/SERVER_RUN2.md): identical to server_4b.yaml except the vision patch embedding, which runs as its
# exact matmul form (live3r.model.patch_embed) - the weekend's Conv3d path is the prime suspect for 16 GPU-s per
# sample (docs/SERVER_RESULTS_20260929.md §2.3). Every run-2 training AND evaluation uses this file, including the
# re-evaluation of the weekend checkpoints, so all run-2 numbers share one numeric path.
patch_embed: linear
# Server (8x H100) — configs/live3r_4b.yaml with this machine's paths, so every entry point
# (train, eval_geometry_ablation, eval_vsi_local, lmms-eval) builds the same model from one file.
# eval_vsi_local.py takes the base model from the config, not from --model, so the path must live here.
# Paths follow docs/NEXT_STEPS_SERVER.md (steps 1 and 5). Used by scripts/server_weekend.sh.
base_model: /group-volume/wooyeol/models/Qwen3.5-4B
dtype: bf16
attn_implementation: sdpa

geometry:
  name: cut3r
  checkpoint: checkpoints/cut3r_512_dpt_4_64.pth
  tap_layers: [6, 9, 12]
  hidden_size: 768
  image_size: 512
  stride: 1
  freeze: true
  expose_pose_token: true
  options:
    repo_path: third_party/CUT3R

fusion:
  mode: deepstack
  inject_layers: [0, 1, 2]
  merge_size: 2
  mlp_ratio: 2.0
  zero_init: true

lora:
  enabled: true
  r: 32
  alpha: 64
  dropout: 0.05

data:
  max_pixels: 131072     # 128 x 32 x 32 -> <= 128 LLM tokens per image (same as every M2 result)
  max_images: 32
  max_length: 8192

stream:
  max_visual_tokens: 16384
  budget_policy: evict
  target_fps: 30.0
