# M2 로컬 S2 파일럿 — LoRA + 프로젝터를 함께 (2026-09-24).
#   데이터: SenseNova-SI 1,000건 미리보기 (학습 905 / 홀드아웃 95)
#   모델:   Qwen3.5-4B + 실제 CUT3R 체크포인트 · LoRA r32 (학습 156M: 프로젝터 95M + LoRA 61M)
#   M2 실측: 0.25 샘플/s · MPS 16GB (최대 19GB) → 1에폭 약 1시간
#   진짜 기하 / 대조(--geom-control shuffled) 두 번 돌려 VSI 로 비교한다.
# 체크포인트 경로는 이 머신 기준 (gitignore 된 checkpoints/).
base_model: checkpoints/qwen3.5-4b
dtype: bf16

geometry:
  name: cut3r
  checkpoint: checkpoints/cut3r_512_dpt_4_64.pth
  tap_layers: [6, 9, 12]
  hidden_size: 768
  image_size: 512
  options:
    repo_path: .refs/CUT3R

fusion:
  mode: deepstack
  inject_layers: [0, 1, 2]
  merge_size: 2
  zero_init: true

lora:
  enabled: true
  r: 32
  alpha: 64
  dropout: 0.05

data:
  max_pixels: 131072     # 128×32×32 → 이미지당 LLM 토큰 ≤128
  max_images: 32
  max_length: 8192
