# Run 3's plain arm evaluated in the prompt form it was TRAINED with (ROLE=format, docs/SERVER_RUN3.md): run 3 trained
# at 5d963f6, before image_newline: false - every image block was followed by "\n" - while the live evaluations
# (10-13) used today's form without it. Same model; only data.image_newline differs from server_4b_v3_plain.yaml.
patch_embed: linear
base_model: /group-volume/wooyeol/models/Qwen3.5-4B
dtype: bf16
attn_implementation: sdpa

geometry:
  name: cut3r
  checkpoint: checkpoints/cut3r_512_dpt_4_64.pth
  tap_layers: [12]
  hidden_size: 768
  image_size: 512
  stride: 1
  freeze: true
  expose_pose_token: false
  options:
    repo_path: third_party/CUT3R
    autocast: bf16         # CUT3R's encoder + rollout under bf16 autocast (the reference's setting; ~2x on H100)

fusion:
  mode: none

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  # every linear layer of the LLM, as the reference's adapter (248 modules on the 4B; ours had left out in_proj_a/b)
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj, in_proj_qkv, in_proj_z, in_proj_a,
                   in_proj_b, out_proj]

data:
  vlm_long_side: 512
  max_images: 32
  max_length: 12800
  video_as_images: true
  video_fps: 0.5
  video_min_frames: 4
  video_max_frames: 8
  marks: draw           # spar_info marks drawn where their frame is certain (data/marks.py)
  strip_reasoning: true  # live: no chain of thought is trained (a leftover <think> block is cut)
  image_newline: true    # the form run 3 was trained with (5d963f6)

stream:
  max_visual_tokens: 16384
  budget_policy: evict
  target_fps: 30.0
