# M2 zero-shot, CUT3R with windowed state resets (I-36, 2026-09-27).
#   Same as m2_zeroshot_4b.yaml, but the recurrent state is dropped every `reset_every` ingested frames, the last
#   `overlap` frames are fed again to the fresh state, and the new window is aligned to the global frame rigidly
#   (no scale carried over: each window is metric on its own). Against the ~10% scale inflation measured when the
#   state accumulated ~100 frames (docs/BRAINSTORM.md I-05).
base_model: checkpoints/qwen3.5-4b
dtype: bf16

geometry:
  name: cut3r
  checkpoint: checkpoints/cut3r_512_dpt_4_64.pth
  tap_layers: [6, 9, 12]
  hidden_size: 768
  image_size: 512
  options:
    repo_path: .refs/CUT3R
    reset_every: 40
    overlap: 3

fusion:
  mode: deepstack
  inject_layers: [0, 1, 2]
  merge_size: 2
  zero_init: true

lora:
  enabled: false

data:
  max_pixels: 131072
  max_images: 32
  max_length: 8192
